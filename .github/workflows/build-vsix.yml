name: Build VSIX

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Visual Studio 2026
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore and build VSIX
        run: dotnet build RhinoVSBridge.sln --configuration Release

      - name: Verify bundled Rhino Dock project template
        shell: pwsh
        run: |
          $vsixPath = "src/RhinoVSBridge/bin/Release/net48/RhinoVSBridge.vsix"
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $vsixPath))
          try {
            $zip.Entries | ForEach-Object { Write-Host "VSIX entry: $($_.FullName)" }
            $required = "ProjectTemplates/Python/RhinoDockPythonProject.zip"
            if (-not ($zip.Entries | Where-Object { $_.FullName.Replace("\\", "/") -eq $required })) {
              throw "Missing Rhino Dock project template in VSIX: $required"
            }
          } finally { $zip.Dispose() }

      - name: Run product C# tests
        run: dotnet run --project tests/RhinoVSBridge.CoreTests/RhinoVSBridge.CoreTests.csproj --configuration Release --no-build

      - name: Run portable contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Package Rhino Dock VSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src/RhinoVSBridge/bin/Release/net48/RhinoVSBridge.vsix artifacts/RhinoDock-v0.5.0.vsix

      - name: Publish VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhinoDock-v0.5.0-${{ github.sha }}
          path: artifacts/RhinoDock-v0.5.0.vsix
          if-no-files-found: error
