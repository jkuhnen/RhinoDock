name: Publish VSIX to Visual Studio Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate or publish
        required: true
        default: v0.6.0
        type: string
      publish:
        description: "Publish this existing release to Marketplace (explicit opt-in; may replace same version)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download and verify release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') { throw "Invalid release tag: $tag" }
          $version = $Matches[1]
          $name = "RhinoDock-$tag.vsix"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $name --dir artifacts
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release download failed' }
          $path = Join-Path $env:GITHUB_WORKSPACE "artifacts/$name"
          if (-not (Test-Path $path)) { throw "Missing release asset: $name" }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead($path)
          try {
            $entry = $zip.GetEntry('extension.vsixmanifest')
            if (-not $entry) { throw 'Missing extension.vsixmanifest' }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $identity = $manifest.PackageManifest.Metadata.Identity
            if ($identity.Version -ne $version) { throw 'Tag and VSIX version mismatch' }
            if ($identity.Publisher -ne 'Johannes Kuhnen') { throw 'VSIX publisher mismatch' }
            if ($identity.Id -ne 'RhinoVSBridge.08e0a5d2-a57b-48e5-8bf6-08f4efb3cf6b') { throw 'VSIX identity mismatch' }
          } finally { $zip.Dispose() }
          $config = Get-Content 'marketplace/publishManifest.json' -Raw | ConvertFrom-Json
          if ($config.publisher -ne 'jkuhnen' -or $config.identity.internalName -ne 'RhinoDock') {
            throw 'Marketplace identity mismatch'
          }
          "RHINO_DOCK_VSIX=$path" >> $env:GITHUB_ENV
          Write-Host "Validated $name; SHA256 $((Get-FileHash $path -Algorithm SHA256).Hash)"

      - name: Publish with Trusted Publishing (OIDC)
        if: github.event_name == 'release' || inputs.publish == true
        shell: pwsh
        run: |
          # Work around VSIX Publisher VsixPub0047: its current -oidc exchange
          # omits an API version. Use the documented Marketplace exchange API
          # and pass the resulting 15-minute credential to the standard publisher.
          # No persistent PAT and no tokens are committed or stored as secrets.
          if (-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN) {
            throw 'GitHub OIDC is unavailable: job must have id-token: write.'
          }
          $url = "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)&audience=marketplace.visualstudio.com"
          $githubToken = Invoke-RestMethod -Uri $url -Method Get -Headers @{
            Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          } -ErrorAction Stop
          if (-not $githubToken.value) { throw 'GitHub did not issue a federated identity token.' }

          # This matches the Microsoft vscode-vsce 4.x Trusted Publishing API.
          $session = Invoke-RestMethod -Uri 'https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1' -Method Post -Headers @{
            Authorization = "FederatedToken $($githubToken.value)"
            Accept = 'application/json'
          } -ContentType 'application/json' -Body '{"publisherName":"jkuhnen"}' -ErrorAction Stop
          if (-not $session.credential) { throw 'Marketplace did not return a temporary session credential.' }
          # Immediately mask the credential before calling any publishing tool.
          Write-Output "::add-mask::$($session.credential)"
          Write-Host 'Marketplace OIDC exchange succeeded.'

          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          if (-not $vsRoot) { throw 'Visual Studio not installed on runner' }
          $exe = Join-Path $vsRoot 'VSSDK/VisualStudioIntegration/Tools/Bin/VsixPublisher.exe'
          if (-not (Test-Path $exe)) { throw "VsixPublisher.exe missing at $exe" }
          & $exe publish -payload $env:RHINO_DOCK_VSIX -publishManifest "$env:GITHUB_WORKSPACE/marketplace/publishManifest.json" -personalAccessToken $session.credential
          if ($LASTEXITCODE -ne 0) { throw "Marketplace publication failed: $LASTEXITCODE" }

      - name: Dry-run complete
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        run: echo "Validation succeeded; Marketplace not modified."
